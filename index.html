<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Color de las barras del sistema: lo ajusta el script de abajo segun el
         tema (oscuro #232220 / claro #fbfaf6), igual que hooks/useTheme.ts. -->
    <meta name="theme-color" content="#232220" />
    <title>Notas</title>
    <script>
      // Aplica el tema ANTES de que cargue la app, sin parpadeo. Oscuro por
      // defecto; claro solo si el usuario lo eligio (ver hooks/useTheme.ts).
      (function () {
        var t = "dark";
        try {
          if (localStorage.getItem("tema-elegido") === "light") t = "light";
          localStorage.removeItem("theme"); // clave vieja, ya no se usa
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", t === "light" ? "#fbfaf6" : "#232220");
      })();
    </script>
  </head>
  <body>
    <!-- React monta toda la app dentro de este div -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
